name: helping_hands
description: "A community service app connecting volunteers with people in need."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase Dependencies
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3  # ← ADDED THIS LINE FOR PROFILE PICTURES
  # UI & Design
  google_fonts: ^6.3.2
  lottie: ^3.3.2
  # Additional helpful packages
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  video_player: ^2.10.0
  chewie: ^1.13.0
  image_picker: ^1.2.0  # ← ADDED THIS LINE FOR PROFILE PICTURE UPLOADS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Add these assets for Lottie animations and custom images
  assets:
    - assets/animations/
    - assets/images/

  # Google Fonts is handled by the package, no need to declare here